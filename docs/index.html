<!DOCTYPE html>

<!--
     MhLightender HTML5 shell.

     This project-level template intentionally keeps the game canvas and the
     browser toolbar as separate, responsive elements.  Do not put the
     toolbar buttons in Bootstrap grid columns: that can make the toolbar
     wider than the browser and hide its controls on mobile.
-->

<html lang="en">
<head>
	<title>MhLightender</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#111827">

	<link href="MhLightender-HTML5-Shipping.css" rel="stylesheet">
</head>
<body>

<section class="distribution-panel" id="distribution_panel" aria-labelledby="distribution_title">
	<div class="distribution-card">
		<p class="distribution-kicker">KEYLESS ABYSS · HTML5 DISTRIBUTION</p>
		<h1 id="distribution_title">Morninghollow: Lightender</h1>
		<p class="distribution-copy">Install the browser build once for faster repeat launches and offline play.</p>
		<p class="distribution-meta" id="distribution_version">Checking build…</p>
		<p class="distribution-meta" id="distribution_installed_at"></p>
		<div class="distribution-actions">
			<button type="button" class="distribution-button primary" id="distribution_install">Install Lightender</button>
			<button type="button" class="distribution-button primary" id="distribution_play" hidden>Play Lightender</button>
			<button type="button" class="distribution-button secondary" id="distribution_update" hidden>Update</button>
			<button type="button" class="distribution-button secondary" id="distribution_uninstall" hidden>Uninstall</button>
		</div>
		<progress id="distribution_progress" max="100" value="0" hidden></progress>
		<p class="distribution-progress-text" id="distribution_progress_text"></p>
		<p class="distribution-status" id="distribution_status" role="status">Preparing the distribution manager…</p>
		<p class="distribution-note">Uninstall removes only the distribution cache. UE4 SaveGame data is preserved.</p>
	</div>
</section>

<div class="wrapper" id="mainarea">
	<div class="alert alert-warning centered-axis-xy" style="min-height: 20px; display:none;" role="alert" id="compilingmessage">
		<div id="loadTasks"></div>
	</div>
	<!-- tabindex=0 lets the canvas receive keyboard focus after a click. -->
	<canvas tabindex="0" id="canvas" class="emscripten" oncontextmenu="event.preventDefault()" style="display:none;"></canvas>
</div>

<!-- Keep these as direct buttons.  A Bootstrap row of col-sm-2 elements can
     exceed 100% width and push the last controls outside the viewport. -->
<div class="buttonarea text-center" id="buttonarea">
	<button type="button" class="btn btn-primary" onclick="try { Module['pauseMainLoop'](); } catch(e) { console.error(e); }">Pause</button>
	<button type="button" class="btn btn-primary" onclick="try { Module['resumeMainLoop'](); } catch(e) { console.error(e); }">Resume</button>
	<button type="button" class="btn btn-primary" onclick="var w = document.getElementById('logwindow'); w.style.display = w.style.display ? '' : 'none';">Toggle Log</button>
	<button type="button" class="btn btn-primary" id="clear_indexeddb" onclick="try { deleteIndexedDBStorage(); } catch(e) { console.error(e); }">Clear IndexedDB</button>
	<button type="button" class="btn btn-primary" id="fullscreen_request">Fullscreen</button>
</div>

<div class="texthalf text-normal jumbotron" id="logwindow" style="display:none"></div>

<script src="LightenderDomShim.js"></script>
<script src="lightender-distribution.js"></script>
</body>
</html>
